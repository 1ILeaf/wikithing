<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firebase Auth Example</title>
</head>
<body>

  <!-- 회원가입 / 로그인 폼 -->
  <div id="auth-container">
    <h2>회원가입</h2>
    <input type="email" id="email" placeholder="이메일">
    <input type="password" id="password" placeholder="비밀번호">
    <input type="text" id="nickname" placeholder="닉네임">
    <button id="signup-btn">회원가입</button>
  </div>

  <!-- 대시보드 / 사용자 정보 -->
  <div id="user-container" style="display: none;">
    <h2>환영합니다, <span id="user-display-name"></span>!</h2>
    <button id="logout-btn">로그아웃</button>

    <!-- 최고 관리자 전용 영역 -->
    <div id="admin-panel" style="display: none; margin-top: 20px; padding: 10px; border: 2px solid red;">
      <h3>⚡ 관리자 최고 권한 ⚡</h3>
      <p>모든 콘텐츠 및 데이터를 수정/삭제할 수 있는 권한이 있습니다.</p>
      <button onclick="alert('관리자 권한: 삭제 처리 완료')">전체 데이터 삭제</button>
      <button onclick="alert('관리자 권한: 수정 처리 완료')">전체 데이터 수정</button>
    </div>
  </div>

  <!-- Firebase SDK (v9+ Modular 버전) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      updateProfile, 
      onAuthStateChanged, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // 1. Firebase 프로젝트 설정 정보 (본인의 프로젝트 값으로 변경)
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "1ileaf.github.io",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Firebase 초기화
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // ★ 최고 권한을 가질 본인의 이메일 주소를 입력하세요 ★
    const ADMIN_EMAIL = "lileaf8631@gmail.com"; 

    // DOM 요소
    const authContainer = document.getElementById("auth-container");
    const userContainer = document.getElementById("user-container");
    const userDisplayName = document.getElementById("user-display-name");
    const adminPanel = document.getElementById("admin-panel");

    // 2. 회원가입 기능 (닉네임 함께 저장)
    document.getElementById("signup-btn").addEventListener("click", async () => {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const nickname = document.getElementById("nickname").value;

      if (!nickname) {
        alert("닉네임을 입력해 주세요.");
        return;
      }

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        // 사용자 닉네임 설정 (displayName)
        await updateProfile(userCredential.user, {
          displayName: nickname
        });

        alert("회원가입 성공!");
        location.reload(); // 새로고침하여 상태 반영
      } catch (error) {
        alert("회원가입 실패: " + error.message);
      }
    });

    // 3. 로그인 상태 감지 및 UI 업데이트
    onAuthStateChanged(auth, (user) => {
      if (user) {
        authContainer.style.display = "none";
        userContainer.style.display = "block";

        // 이모티콘 및 '사용자님' 텍스트 제거 -> 닉네임(displayName)만 표시
        userDisplayName.innerText = user.displayName || user.email;

        // 4. 최고 관리자 권한 부여 체크
        if (user.email === ADMIN_EMAIL) {
          adminPanel.style.display = "block";
        } else {
          adminPanel.style.display = "none";
        }
      } else {
        authContainer.style.display = "block";
        userContainer.style.display = "none";
      }
    });

    // 5. 로그아웃
    document.getElementById("logout-btn").addEventListener("click", () => {
      signOut(auth).then(() => alert("로그아웃 되었습니다."));
    });
  </script>
</body>
</html>
