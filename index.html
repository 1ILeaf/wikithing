<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WIKI (아님)</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #f0f0f0;
      --border-color: #ffffff;
      --accent-color: #2a2a2a;
      --quote-border: #2ecc71;
      --table-header-bg: #4a4a4a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* 사이드바 어두운 배경 오버레이 (모바일용) */
    #sidebar-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 19;
      backdrop-filter: blur(2px);
    }
    #sidebar-overlay.active {
      display: block;
    }

    /* 사이드바 기본 스타일 */
    #sidebar {
      width: 280px;
      border-right: 1px solid #333;
      display: flex;
      flex-direction: column;
      background: var(--bg-color);
      z-index: 20;
      transition: transform 0.3s ease;
    }

    #sidebar-header {
      padding: 15px;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #sidebar-header h2 {
      font-size: 1.1rem;
    }

    .btn {
      background: #333;
      color: #fff;
      border: 1px solid #555;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .btn:hover {
      background: #444;
    }

    #doc-tree {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .tree-item {
      padding: 8px 10px;
      margin: 2px 0;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .tree-item:hover {
      background: #252525;
    }

    .tree-item.active {
      background: #333;
      font-weight: bold;
    }

    .tree-indent {
      margin-left: 15px;
    }

    /* 메인 콘텐츠 영역 */
    #main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      width: 100%;
    }

    #top-bar {
      padding: 10px 15px;
      border-bottom: 1px solid #333;
      display: flex;
      gap: 10px;
      align-items: center;
      background: #181818;
    }

    /* 모바일 토글 버튼 (햄버거 메뉴) */
    #sidebar-toggle {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 1.4rem;
      cursor: pointer;
      padding: 2px 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #search-input {
      flex: 1;
      background: #252525;
      border: 1px solid #444;
      color: #fff;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 0.9rem;
      min-width: 0;
    }

    #content-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      gap: 20px;
      flex-direction: row;
    }

    #wiki-body {
      flex: 1;
      max-width: 800px;
    }

    #wiki-body h1 {
      font-size: 1.8rem;
      margin-bottom: 15px;
      border-bottom: 2px solid #444;
      padding-bottom: 8px;
      word-break: break-all;
    }

    #wiki-body h2 {
      font-size: 1.3rem;
      margin: 20px 0 10px 0;
      border-bottom: 1px solid #333;
      padding-bottom: 4px;
      word-break: break-all;
    }

    #wiki-body h3 {
      font-size: 1.05rem;
      margin: 15px 0 8px 0;
      word-break: break-all;
    }

    #wiki-body p {
      line-height: 1.6;
      margin-bottom: 10px;
      word-break: break-word;
    }

    .infobox {
      width: 280px;
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 6px;
      padding: 15px;
      height: fit-content;
      flex-shrink: 0;
    }

    .infobox-title {
      text-align: center;
      font-weight: bold;
      font-size: 1.05rem;
      padding-bottom: 8px;
      border-bottom: 1px solid #444;
      margin-bottom: 10px;
    }

    .infobox-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    .infobox-table td {
      padding: 6px;
      border-bottom: 1px solid #333;
    }

    .infobox-table td:first-child {
      font-weight: bold;
      width: 40%;
      color: #aaa;
    }

    /* 편집 모달 (팝업창) */
    #edit-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      z-index: 100;
      padding: 15px;
      overflow-y: auto;
    }

    .modal-content {
      background: #1e1e1e;
      max-width: 650px;
      width: 100%;
      margin: 20px auto;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
      color: #ddd;
    }

    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      background: #2b2b2b;
      border: 1px solid #444;
      color: #fff;
      padding: 10px;
      border-radius: 4px;
      font-size: 0.95rem;
    }

    .form-group textarea {
      height: 160px;
      resize: vertical;
    }

    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    /* 📱 모바일 전용 미디어 쿼리 (화면 너비 768px 이하) */
    @media (max-width: 768px) {
      #sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        width: 260px;
        transform: translateX(-100%);
        box-shadow: 2px 0 10px rgba(0,0,0,0.5);
      }

      #sidebar.open {
        transform: translateX(0);
      }

      #content-area {
        flex-direction: column-reverse;
        padding: 15px;
      }

      .infobox {
        width: 100%;
      }

      .modal-content {
        margin: 10px auto;
        padding: 15px;
      }

      #top-bar {
        padding: 8px 10px;
        gap: 6px;
      }

      .btn {
        padding: 6px 8px;
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>

  <!-- 모바일 사이드바 배경 어둡게 처리 -->
  <div id="sidebar-overlay" onclick="toggleSidebar()"></div>

  <!-- 좌측 사이드바 (서랍형) -->
  <div id="sidebar">
    <div id="sidebar-header">
      <h2>WIKI 목차</h2>
      <button class="btn" onclick="openEditModal(); closeSidebarIfMobile();">+ 새 문서</button>
    </div>
    <div id="doc-tree"></div>
  </div>

  <!-- 메인 영역 -->
  <div id="main-content">
    <div id="top-bar">
      <button id="sidebar-toggle" onclick="toggleSidebar()" title="목차 열기/닫기">☰</button>
      <input type="text" id="search-input" placeholder="문서 검색..." oninput="searchDocs()">
      <button class="btn" onclick="editCurrentDoc()">편집</button>
      <button class="btn" onclick="deleteCurrentDoc()" style="background:#8b0000;">삭제</button>
    </div>

    <div id="content-area">
      <div id="wiki-body"></div>
      <div id="wiki-infobox" class="infobox" style="display:none;"></div>
    </div>
  </div>

  <!-- 모바일 대응 문서 편집/생성 모달 -->
  <div id="edit-modal">
    <div class="modal-content">
      <h2 id="modal-title" style="margin-bottom:15px;">문서 편집</h2>
      <div class="form-group">
        <label>제목</label>
        <input type="text" id="doc-title" placeholder="문서 제목을 입력하세요">
      </div>
      <div class="form-group">
        <label>상위 문서 (목차 단계)</label>
        <select id="doc-parent"></select>
      </div>
      <div class="form-group">
        <label>내용 (위키 문법: == 제목 ==, === 소제목 ===, **강조**)</label>
        <textarea id="doc-content" placeholder="내용을 작성하세요..."></textarea>
      </div>
      <div class="form-group">
        <label>인포박스 항목 (줄바꿈 구분, 예: 만든놈:아이리프)</label>
        <textarea id="doc-infobox" style="height:60px;" placeholder="만든놈:아이리프"></textarea>
      </div>
      <div class="modal-buttons">
        <button class="btn" onclick="closeEditModal()">취소</button>
        <button class="btn" style="background:#2e7d32;" onclick="saveDoc()">저장</button>
      </div>
    </div>
  </div>

  <script>
    const initialDefaultData = [
      {
        "id": 1787935252232,
        "title": "금지템목록",
        "content": "== 개요 ==\nffa라 잘못쓰면 팀킬 ㅈㄴ하니까 말하고 써라\n\n=== 근접 ===\n**아라야시키 / arayashiki**\nㄴ 아이템 이름 사라짐\n**완드 / wand**\nㄴ 심한넉백\n\n=== 원거리 ===\n**아메리카 / america**\nㄴ 심한넉백\n**apc**\nㄴ 물리엔진이슈\n\n=== 유틸 ===\n**death note**\nㄴ즉사\n**snap**\nㄴ운좋으면즉사\n**presidential key**\nㄴ 두명이한번에쓰면이세카이감\n\n=== 기타 ===\n\n스크롤 -  **mori**\nㄴ즉사\n**amulet of white king **\nㄴ보스한테만 ㄴ\n**Pact**\nㄴ보스한테만 ㄴ\n**각성템들**\nㄴ 눈물콸콸희생작전으로 채우기 금지\n예: da capo / smile / ssg 등\n=== 팀킬관련 ===\n**fission** (부분적 금지)\nㄴ 팀킬시발아\n**master spark** (부분적 금지)\nㄴ시발누가지금썼냐\n**블랙홀 레이건 / blackhole raygun** (부분적 금지) (킬만 ㄴ)\nㄴ팀킬시발\n**lilynette**\nㄴ나한테쏘지마시발아\n**asteroid** (부분적)\nㄴ Q 잘보고써라 시발아\n\n팀킬할만한 템들은 알아서 잘써라 ㅉ",
        "parentId": null,
        "bgColor": "#1e1e1e",
        "textColor": "#f0f0f0",
        "borderColor": "#ffffff",
        "infoboxImg": "",
        "infoboxData": [{"key": "만든놈", "val": "아이리프"}],
        "images": []
      },
      {
        "id": 1787935369440,
        "title": "각성템 모음",
        "content": "== 근접 ==\n**amateur dentist**\n**chair**\n**da capo**\n**eyelander**\n**legion kata**\n**photon blade **\n**real knife **\n**small sword**\n**smile**\n**spike grinders**\n\n== 원거리 ==\n**9mm**\n**airpot shotty**\n**cleanse and repent** (킬당 목숨)\n**m1911**\n**makarov**\n**pixel gun**\n**ssg-08**\n**suppressed pistol**",
        "parentId": 1787935252232,
        "bgColor": "#1e1e1e",
        "textColor": "#f0f0f0",
        "borderColor": "#ffffff",
        "infoboxImg": "",
        "infoboxData": [],
        "images": []
      }
    ];

    let docs = [];
    let currentDocId = null;

    function init() {
      const saved = localStorage.getItem('wiki_docs');
      if (saved) {
        try {
          docs = JSON.parse(saved);
        } catch(e) {
          docs = initialDefaultData;
        }
      } else {
        docs = initialDefaultData;
        localStorage.setItem('wiki_docs', JSON.stringify(docs));
      }

      renderTree();
      if (docs.length > 0) {
        selectDoc(docs[0].id);
      }
    }

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      const isOpen = sidebar.classList.contains('open');

      if (isOpen) {
        sidebar.classList.remove('open');
        overlay.classList.remove('active');
      } else {
        sidebar.classList.add('open');
        overlay.classList.add('active');
      }
    }

    function closeSidebarIfMobile() {
      if (window.innerWidth <= 768) {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('sidebar-overlay').classList.remove('active');
      }
    }

    function renderTree(filterText = '') {
      const treeContainer = document.getElementById('doc-tree');
      treeContainer.innerHTML = '';

      let filteredDocs = docs;
      if (filterText.trim()) {
        const query = filterText.toLowerCase();
        filteredDocs = docs.filter(d => d.title.toLowerCase().includes(query) || d.content.toLowerCase().includes(query));
      }

      const topDocs = filteredDocs.filter(d => !d.parentId);
      topDocs.forEach(doc => {
        treeContainer.appendChild(createTreeItem(doc, filteredDocs));
      });
    }

    function createTreeItem(doc, filteredDocs) {
      const div = document.createElement('div');
      div.className = `tree-item ${doc.id === currentDocId ? 'active' : ''}`;
      div.innerText = doc.title;
      div.onclick = () => {
        selectDoc(doc.id);
        closeSidebarIfMobile();
      };

      const wrapper = document.createElement('div');
      wrapper.appendChild(div);

      const children = filteredDocs.filter(d => d.parentId === doc.id);
      if (children.length > 0) {
        const childContainer = document.createElement('div');
        childContainer.className = 'tree-indent';
        children.forEach(child => {
          childContainer.appendChild(createTreeItem(child, filteredDocs));
        });
        wrapper.appendChild(childContainer);
      }

      return wrapper;
    }

    function selectDoc(id) {
      currentDocId = id;
      const doc = docs.find(d => d.id === id);
      if (!doc) return;

      renderTree(document.getElementById('search-input').value);

      // Render Content
      const body = document.getElementById('wiki-body');
      let html = `<h1>${escapeHtml(doc.title)}</h1>`;
      
      let parsedContent = escapeHtml(doc.content)
        .replace(/== (.*?) ==/g, '<h2>$1</h2>')
        .replace(/=== (.*?) ===/g, '<h3>$1</h3>')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\n/g, '<br>');

      html += `<p>${parsedContent}</p>`;
      body.innerHTML = html;

      // Render Infobox
      const infobox = document.getElementById('wiki-infobox');
      if (doc.infoboxData && doc.infoboxData.length > 0) {
        infobox.style.display = 'block';
        let infoHtml = `<div class="infobox-title">${escapeHtml(doc.title)}</div>`;
        infoHtml += `<table class="infobox-table">`;
        doc.infoboxData.forEach(item => {
          infoHtml += `<tr><td>${escapeHtml(item.key)}</td><td>${escapeHtml(item.val)}</td></tr>`;
        });
        infoHtml += `</table>`;
        infobox.innerHTML = infoHtml;
      } else {
        infobox.style.display = 'none';
      }
    }

    function searchDocs() {
      const query = document.getElementById('search-input').value;
      renderTree(query);
    }

    function openEditModal(isEdit = false) {
      const modal = document.getElementById('edit-modal');
      const parentSelect = document.getElementById('doc-parent');
      parentSelect.innerHTML = '<option value="">없음 (최상위)</option>';

      docs.forEach(d => {
        if (!isEdit || d.id !== currentDocId) {
          parentSelect.innerHTML += `<option value="${d.id}">${escapeHtml(d.title)}</option>`;
        }
      });

      if (isEdit && currentDocId) {
        const doc = docs.find(d => d.id === currentDocId);
        document.getElementById('modal-title').innerText = '문서 수정';
        document.getElementById('doc-title').value = doc.title;
        document.getElementById('doc-parent').value = doc.parentId || '';
        document.getElementById('doc-content').value = doc.content;
        
        let infoStr = (doc.infoboxData || []).map(i => `${i.key}:${i.val}`).join('\n');
        document.getElementById('doc-infobox').value = infoStr;
      } else {
        document.getElementById('modal-title').innerText = '새 문서 작성';
        document.getElementById('doc-title').value = '';
        document.getElementById('doc-parent').value = '';
        document.getElementById('doc-content').value = '';
        document.getElementById('doc-infobox').value = '';
      }

      modal.style.display = 'block';
    }

    function editCurrentDoc() {
      if (currentDocId) openEditModal(true);
    }

    function closeEditModal() {
      document.getElementById('edit-modal').style.display = 'none';
    }

    function saveDoc() {
      const title = document.getElementById('doc-title').value.trim();
      const parentIdVal = document.getElementById('doc-parent').value;
      const content = document.getElementById('doc-content').value;
      const infoboxRaw = document.getElementById('doc-infobox').value;

      if (!title) {
        alert('제목을 입력하세요!');
        return;
      }

      const infoboxData = infoboxRaw.split('\n').filter(line => line.includes(':')).map(line => {
        const [key, ...val] = line.split(':');
        return { key: key.trim(), val: val.join(':').trim() };
      });

      const isEdit = document.getElementById('modal-title').innerText === '문서 수정';

      if (isEdit) {
        const doc = docs.find(d => d.id === currentDocId);
        doc.title = title;
        doc.parentId = parentIdVal ? Number(parentIdVal) : null;
        doc.content = content;
        doc.infoboxData = infoboxData;
      } else {
        const newDoc = {
          id: Date.now(),
          title: title,
          content: content,
          parentId: parentIdVal ? Number(parentIdVal) : null,
          bgColor: "#1e1e1e",
          textColor: "#f0f0f0",
          borderColor: "#ffffff",
          infoboxImg: "",
          infoboxData: infoboxData,
          images: []
        };
        docs.push(newDoc);
        currentDocId = newDoc.id;
      }

      localStorage.setItem('wiki_docs', JSON.stringify(docs));
      closeEditModal();
      renderTree(document.getElementById('search-input').value);
      selectDoc(currentDocId);
    }

    function deleteCurrentDoc() {
      if (!currentDocId) return;
      if (confirm('이 문서를 삭제하시겠습니까?')) {
        docs = docs.filter(d => d.id !== currentDocId);
        localStorage.setItem('wiki_docs', JSON.stringify(docs));
        currentDocId = docs.length > 0 ? docs[0].id : null;
        renderTree(document.getElementById('search-input').value);
        if (currentDocId) selectDoc(currentDocId);
        else document.getElementById('wiki-body').innerHTML = '';
      }
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    init();
  </script>
</body>
</html>
