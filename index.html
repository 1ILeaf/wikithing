<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trusted Logo</title>
  <style>
    /* 다크 모드 배경 설정 (제공해주신 캡처 화면 스타일) */
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      padding: 20px;
    }

    /* 로고 컨테이너 */
    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* 이미지 스타일링: 크기 및 테두리(아웃라인) 설정 */
    .logo-img {
      width: 32px;            /* 원하시는 크기로 조절 가능 */
      height: 32px;           /* 원하시는 크기로 조절 가능 */
      object-fit: contain;
      
      /* 테두리(Outline/Border) 설정 */
      border: 2px solid #00d2ff; /* 테두리 두께 및 색상 (원하는 색상으로 변경 가능) */
      border-radius: 6px;       /* 테두리 모서리 둥글기 */
      padding: 2px;             /* 이미지와 테두리 사이 간격 */
      box-shadow: 0 0 8px rgba(0, 210, 255, 0.4); /* (선택) 깔끔한 발광 효과 */
    }

    /* 텍스트 스타일 */
    .logo-text {
      font-size: 20px;
      font-weight: bold;
      color: #38b6ff;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="logo-container">
    <!-- 변환된 구글 드라이브 이미지 주소 반영 -->
    <img 
      src="https://drive.google.com/thumbnail?id=1YEHTbjNPFllTakGWWNv_ahVicEgVeJZS&sz=w1000" 
      alt="Trusted Logo" 
      class="logo-img"
    >
    <span class="logo-text">Trusted Logo</span>
  </div>

</body>
</html>
